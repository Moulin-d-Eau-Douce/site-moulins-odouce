name: Deploy site on release

on:
  release:
    types: [published]
  workflow_dispatch:        # permet aussi un déclenchement manuel

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du tag de la release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Préparation de la clé SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Écriture de la clé privée (les retours à la ligne du secret sont conservés)
          printf '%s\n' "$VPS_SSH_KEY" | sed -e 's/[[:space:]]*$//' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Vérifie que la clé est valide AVANT de tenter le déploiement
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub; then
            echo "::error::Le secret VPS_SSH_KEY n'est pas une clé privée OpenSSH valide."
            echo "Vérifie qu'il contient les lignes BEGIN/END et tous les retours à la ligne."
            exit 1
          fi
          echo "Empreinte de la clé utilisée :"
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

          # known_hosts : secret si fourni, sinon scan de l'hôte
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS vide, utilisation de ssh-keyscan (TOFU)."
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts
          wc -l < ~/.ssh/known_hosts | xargs echo "Lignes dans known_hosts :"

      - name: Test de connexion SSH
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -v -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'echo "Connexion OK sur $(hostname)"; ls -ld /mnt/data/static/lesmoulinsdeaudouce/'

      - name: Déploiement par rsync
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -rlptvz --delete \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude 'README*' --exclude '*.zip' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./ "$VPS_USER@$VPS_HOST:/mnt/data/static/lesmoulinsdeaudouce/"
